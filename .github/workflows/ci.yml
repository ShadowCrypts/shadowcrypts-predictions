name: CI

on:
  push:
  pull_request:

# Read-only: the checks only need the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type check, lint (with the React Compiler rules) and every unit test.
      - run: npm run verify
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
